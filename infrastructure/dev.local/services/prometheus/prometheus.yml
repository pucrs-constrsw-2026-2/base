global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'keycloak'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['keycloak:9001']

  - job_name: 'oauth'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['oauth:3001']
